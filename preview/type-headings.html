<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 24px; background: var(--surface-page); display: grid; gap: 8px; }
  .row { display: grid; grid-template-columns: 72px 1fr 180px; gap: 16px; align-items: baseline; padding: 10px 12px; border-bottom: 1px solid var(--border-subtle); }
  .row:last-child { border-bottom: none; }
  .tag { color: var(--fg-3); font: var(--type-body-sm-reg); }
  .meta { color: var(--fg-3); font: var(--type-body-xs); text-align: right; }
</style></head>
<body>
  <div class="row"><span class="tag">H1</span><span class="h1">Humanizing Ai</span><span class="meta">Roboto Bold · 36 · lh 0.88</span></div>
  <div class="row"><span class="tag">H2</span><span class="h2">Meet SalesAi's voice agents</span><span class="meta">Roboto Bold · 28 · lh 0.88</span></div>
  <div class="row"><span class="tag">H3</span><span class="h3">Answered calls this week</span><span class="meta">Roboto Bold · 20 · lh 0.88</span></div>
  <div class="row"><span class="tag">H4</span><span class="h4">Agent details</span><span class="meta">Roboto Bold · 18 · lh 0.88</span></div>
</body></html>
