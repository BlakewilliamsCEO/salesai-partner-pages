<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 24px; background: var(--surface-page); display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .logo { width: 72px; height: 72px; border: 1px solid var(--border-subtle); border-radius: 12px; background: var(--surface-raised); display: grid; place-items: center; overflow: hidden; }
  .logo img { max-width: 60%; max-height: 60%; object-fit: contain; }
  .caption { flex-basis: 100%; margin-top: 8px; color: var(--fg-3); font: var(--type-body-sm-reg); }
</style></head>
<body>
  <div class="logo"><img src="../assets/logos/logo-hubspot.png" alt="HubSpot"></div>
  <div class="logo"><img src="../assets/logos/logo-salesforce.png" alt="Salesforce"></div>
  <div class="logo"><img src="../assets/logos/logo-twilio.png" alt="Twilio"></div>
  <div class="logo"><img src="../assets/logos/logo-openai.png" alt="OpenAI"></div>
  <div class="logo"><img src="../assets/logos/logo-webhook.png" alt="Webhook"></div>
  <div class="logo"><img src="../assets/logos/logo-calendly.png" alt="Calendly"></div>
  <div class="logo"><img src="../assets/logos/logo-outlook.png" alt="Outlook"></div>
  <div class="logo"><img src="../assets/logos/logo-google.png" alt="Google Calendar"></div>
  <div class="logo"><img src="../assets/logos/logo-google-sheets.png" alt="Google Sheets"></div>
  <div class="logo"><img src="../assets/logos/logo-ghl.png" alt="GHL"></div>
  <span class="caption">Integrations — always shown in brand color on a neutral raised surface. Never desaturate, never add a mint tint.</span>
</body></html>
