<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 24px; background: var(--surface-page); display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .btn { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 20px; border-radius: 8px; font: var(--type-body-md-med); letter-spacing: 0.005em; cursor: pointer; border: 1px solid transparent; }
  .primary { background: var(--mint-default); color: var(--fg-on-brand); border-color: var(--mint-pressed); }
  .secondary { background: var(--mint-80); color: var(--mint-default); border-color: var(--mint-240); }
  .tertiary { background: var(--neutral-900); color: var(--fg-1); border-color: var(--neutral-700); }
  .ghost { background: transparent; color: var(--fg-1); border-color: transparent; }
  .disabled { background: var(--neutral-900); color: var(--fg-disabled); border-color: var(--border-subtle); cursor: not-allowed; }
  .sm { height: 32px; padding: 0 14px; font: var(--type-body-sm-med); }
  svg { width: 14px; height: 14px; }
</style></head>
<body>
  <button class="btn primary"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 3v10M3 8h10"/></svg>Primary</button>
  <button class="btn secondary">Secondary</button>
  <button class="btn tertiary">Tertiary</button>
  <button class="btn ghost">Ghost</button>
  <button class="btn disabled">Disabled</button>
  <button class="btn primary sm">Small</button>
</body></html>
