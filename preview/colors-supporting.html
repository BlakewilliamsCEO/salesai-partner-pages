<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 24px; background: var(--surface-page); display: flex; gap: 18px; align-items: stretch; }
  .sw { flex: 1; display: flex; flex-direction: column; gap: 10px; }
  .chip { height: 88px; border-radius: 10px; border: 1px solid var(--border-subtle); }
  .meta { display: flex; justify-content: space-between; align-items: baseline; padding: 0 2px; }
  .name { color: var(--fg-1); font: var(--type-body-sm-med); }
  .hex  { color: var(--fg-3); font: var(--type-body-xs); font-family: var(--font-mono); text-transform: uppercase; }
  .desc { color: var(--fg-3); font: var(--type-body-xs); padding: 0 2px; min-height: 28px; }
</style></head>
<body>
  <div class="sw">
    <div class="chip" style="background: #236BD0;"></div>
    <div class="meta"><span class="name">Support blue</span><span class="hex">#236BD0</span></div>
    <div class="desc">Information, links on light backgrounds.</div>
  </div>
  <div class="sw">
    <div class="chip" style="background: #955DF1;"></div>
    <div class="meta"><span class="name">Support purple</span><span class="hex">#955DF1</span></div>
    <div class="desc">Tags, creative categories, secondary CTA.</div>
  </div>
  <div class="sw">
    <div class="chip" style="background: #602BB6;"></div>
    <div class="meta"><span class="name">Deep purple</span><span class="hex">#602BB6</span></div>
    <div class="desc">Full-bleed backgrounds, feature tiles.</div>
  </div>
  <div class="sw">
    <div class="chip" style="background: #F69315;"></div>
    <div class="meta"><span class="name">Support orange</span><span class="hex">#F69315</span></div>
    <div class="desc">Callouts, promotional accents.</div>
  </div>
</body></html>
