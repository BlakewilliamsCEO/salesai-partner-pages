<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 24px; background: var(--surface-page); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 999px; font: var(--type-body-sm-med); border: 1px solid transparent; }
  .dot { width: 6px; height: 6px; border-radius: 999px; background: currentColor; }
  .brand   { background: var(--mint-80); color: var(--mint-default); border-color: var(--mint-240); }
  .success { background: rgba(33,184,115,0.10); color: var(--mint-default); }
  .info    { background: rgba(38,169,216,0.10); color: var(--info); }
  .warning { background: rgba(255,184,0,0.10); color: var(--warning); }
  .error   { background: rgba(228,88,100,0.10); color: var(--error-border); }
  .neutral { background: var(--neutral-800); color: var(--fg-2); border-color: var(--border-subtle); }
</style></head>
<body>
  <span class="badge brand"><span class="dot"></span>Live</span>
  <span class="badge success">Answered</span>
  <span class="badge info">New</span>
  <span class="badge warning">Queued</span>
  <span class="badge error">Failed</span>
  <span class="badge neutral">Draft</span>
  <span class="badge neutral">+3 more</span>
</body></html>
