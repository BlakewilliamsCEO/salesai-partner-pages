<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 24px; background: var(--surface-page); display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; }
  .box { height: 72px; border-radius: 12px; background: var(--neutral-900); border: 1px solid var(--border-subtle); display: flex; align-items: flex-end; padding: 8px 12px; font: var(--type-body-sm-reg); color: var(--fg-2); }
</style></head>
<body>
  <div class="box" style="box-shadow: var(--shadow-xs);">xs · inputs</div>
  <div class="box" style="box-shadow: var(--shadow-sm);">sm · buttons</div>
  <div class="box" style="box-shadow: var(--shadow-md);">md · cards</div>
  <div class="box" style="box-shadow: var(--shadow-lg);">lg · panels</div>
  <div class="box" style="box-shadow: var(--shadow-xl);">xl · sheets</div>
</body></html>
