<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 20px; background: var(--surface-page); }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .swatch { aspect-ratio: 1.6/1; border-radius: 10px; display: flex; flex-direction: column; justify-content: flex-end; padding: 10px; border: 1px solid var(--border-subtle); }
  .name { font: var(--type-body-sm-med); color: var(--neutral-950); }
  .hex  { font: var(--type-body-xs); color: rgba(10,10,12,.75); }
</style></head>
<body>
  <div class="row">
    <div class="swatch" style="background: var(--info);"><span class="name">/info</span><span class="hex">#26A9D8</span></div>
    <div class="swatch" style="background: var(--success);"><span class="name">/success</span><span class="hex">#21B873</span></div>
    <div class="swatch" style="background: var(--warning);"><span class="name">/warning</span><span class="hex">#FFB800</span></div>
    <div class="swatch" style="background: var(--error-border);"><span class="name">/error</span><span class="hex">#ED7E88</span></div>
  </div>
</body></html>
