<!doctype html>
<html lang="en">
<head>

<title>Build a modern front office — SalesAi for Watsco dealers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap">
<style>
:root { --bg:#FFFFFF; --fg:#0A0C10; --mut:#5F6061; --line:#EEEEF0; --card:#FFFFFF; --accent:#955DF1; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#0A0C10; --fg:#F5F5F7; --mut:#ABADAE; --line:#272729; --card:#141416; --accent:#B98BF7; } }
:root[data-theme="dark"] { --bg:#0A0C10; --fg:#F5F5F7; --mut:#ABADAE; --line:#272729; --card:#141416; --accent:#B98BF7; }
* { box-sizing: border-box; }
html, body { max-width:100%; overflow-x:hidden; }
body { margin:0; background:var(--bg); color:var(--fg); font-family:"Inter Tight","Helvetica Neue",Arial,sans-serif; -webkit-font-smoothing:antialiased; }
header { padding:32px 20px 22px; border-bottom:1px solid var(--line); }
.wrap { max-width:1100px; margin:0 auto; }
h1 { margin:0 0 7px; font-size:25px; letter-spacing:-0.02em; }
header p { margin:0; font-size:14px; color:var(--mut); }
main { padding:22px 16px 72px; max-width:1100px; margin:0 auto; display:flex; flex-direction:column; gap:28px; }
figure { margin:0; min-width:0; max-width:100%; }
img { width:100%; max-width:100%; height:auto; display:block; border:1px solid var(--line); border-radius:10px; background:var(--card); }
figcaption { margin-top:9px; font-size:13px; color:var(--mut); display:flex; gap:9px; align-items:baseline; }
.n { font-variant-numeric:tabular-nums; font-weight:700; color:var(--accent); }
footer { border-top:1px solid var(--line); padding:26px 16px 44px; }
footer p { max-width:1100px; margin:0 auto; font-size:13px; line-height:1.6; color:var(--mut); }

.js figure { opacity:0; transform:translateY(26px) scale(.995); filter:blur(7px);
  transition:opacity .75s ease, transform .75s cubic-bezier(.16,1,.3,1), filter .75s ease;
  will-change:opacity, transform, filter; }
.js figure.in { opacity:1; transform:none; filter:none; }
@media (prefers-reduced-motion: reduce) {
  .js figure { opacity:1 !important; transform:none !important; filter:none !important; transition:none !important; }
}
</style>
</head>
<body>
<header><div class="wrap">

<script>
(function(){
  var d=document.documentElement;
  if(!('IntersectionObserver' in window)) return;
  d.classList.add('js');
  function arm(){
    var io=new IntersectionObserver(function(es){
      es.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
    },{rootMargin:'0px 0px -10% 0px', threshold:0.08});
    document.querySelectorAll('figure').forEach(function(f){ io.observe(f); });
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',arm); else arm();
})();
</script>
