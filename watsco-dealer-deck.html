<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#0A0C10">
<title>Build a modern front office — SalesAi for Watsco dealers</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&display=swap">
<style>
*{box-sizing:border-box}
html{scroll-snap-type:y mandatory;scroll-behavior:smooth;background:#0A0C10}
body{margin:0;background:#0A0C10;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.s{height:100svh;min-height:100vh;display:flex;align-items:center;justify-content:center;
   scroll-snap-align:center;scroll-snap-stop:always;padding:0 clamp(8px,2.2vw,44px)}
.s img{display:block;width:100%;max-width:calc((100svh - 6vh) * 16 / 9);max-height:94svh;
   object-fit:contain;border-radius:8px;box-shadow:0 30px 90px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.06)}
.js .s img{opacity:0;transform:translateY(18px) scale(.985);
   transition:opacity .6s ease,transform .7s cubic-bezier(.16,1,.3,1)}
.js .s.in img{opacity:1;transform:none}
.count{position:fixed;right:max(18px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));
   z-index:10;color:rgba(255,255,255,.42);font:500 13px/1 "Inter Tight",system-ui,sans-serif;
   font-variant-numeric:tabular-nums;letter-spacing:.06em;pointer-events:none}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .js .s img{opacity:1!important;transform:none!important;transition:none!important}}
@media (max-width:640px){ .s{height:auto;min-height:0;padding:10px 10px;scroll-snap-align:none}
  html{scroll-snap-type:none} .s img{max-width:100%;max-height:none} }
</style>
</head>
<body>
<section class="s" data-n="01"><img src="watsco-deck/01.jpg?v=8dd564cd36" width="2400" height="1350" alt="Slide 01 — Introducing"></section>
<section class="s" data-n="02"><img src="watsco-deck/02.jpg?v=80ea798664" width="2400" height="1350" alt="Slide 02 — Cover"></section>
<section class="s" data-n="03"><img src="watsco-deck/03.jpg?v=b29d1d38a8" width="2400" height="1350" alt="Slide 03 — Sound familiar?" loading="lazy" decoding="async"></section>
<section class="s" data-n="04"><img src="watsco-deck/04.jpg?v=5ed5ec9afa" width="2400" height="1350" alt="Slide 04 — The question" loading="lazy" decoding="async"></section>
<section class="s" data-n="05"><img src="watsco-deck/05.jpg?v=6aecb81ecc" width="2400" height="1350" alt="Slide 05 — The product" loading="lazy" decoding="async"></section>
<section class="s" data-n="06"><img src="watsco-deck/06.jpg?v=4ed54e935d" width="2400" height="1350" alt="Slide 06 — How it fits together" loading="lazy" decoding="async"></section>
<section class="s" data-n="07"><img src="watsco-deck/07.jpg?v=059adf700e" width="2400" height="1350" alt="Slide 07 — Play 01 · Capture demand" loading="lazy" decoding="async"></section>
<section class="s" data-n="08"><img src="watsco-deck/08.jpg?v=b59786e5dd" width="2400" height="1350" alt="Slide 08 — Play 02 · Convert to replacement" loading="lazy" decoding="async"></section>
<section class="s" data-n="09"><img src="watsco-deck/09.jpg?v=ffba60d0a7" width="2400" height="1350" alt="Slide 09 — Play 03 · Coordinate execution" loading="lazy" decoding="async"></section>
<section class="s" data-n="10"><img src="watsco-deck/10.jpg?v=fa9eec9f46" width="2400" height="1350" alt="Slide 10 — Play 04 · Care after the sale" loading="lazy" decoding="async"></section>
<section class="s" data-n="11"><img src="watsco-deck/11.jpg?v=0dd8a9b20b" width="2400" height="1350" alt="Slide 11 — What compounds" loading="lazy" decoding="async"></section>
<section class="s" data-n="12"><img src="watsco-deck/12.jpg?v=47e6ed5370" width="2400" height="1350" alt="Slide 12 — Proof" loading="lazy" decoding="async"></section>
<section class="s" data-n="13"><img src="watsco-deck/13.jpg?v=84be0091f0" width="2400" height="1350" alt="Slide 13 — Enterprise-grade security" loading="lazy" decoding="async"></section>
<section class="s" data-n="14"><img src="watsco-deck/14.jpg?v=cecd297e04" width="2400" height="1350" alt="Slide 14 — Your quote" loading="lazy" decoding="async"></section>
<section class="s" data-n="15"><img src="watsco-deck/15.jpg?v=428baae9e3" width="2400" height="1350" alt="Slide 15 — Claim your dealer credit" loading="lazy" decoding="async"></section>
<div class="count" id="c">01 / 15</div>
<script>
(function(){
  var d=document.documentElement, c=document.getElementById('c');
  if(!('IntersectionObserver' in window)) return;
  d.classList.add('js');
  function arm(){
    var secs=[].slice.call(document.querySelectorAll('.s'));
    var io=new IntersectionObserver(function(es){
      es.forEach(function(e){
        if(e.isIntersecting){
          e.target.classList.add('in');
          if(e.intersectionRatio>0.5) c.textContent=e.target.dataset.n+' / 15';
        }
      });
    },{threshold:[0.15,0.55]});
    secs.forEach(function(s){io.observe(s)});
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',arm); else arm();
})();
</script>
</body>
</html>
